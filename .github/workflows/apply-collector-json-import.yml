name: Apply collector startup repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.head_ref == 'fix/collector-json-import-20260725' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/collector-json-import-20260725
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Add missing runtime import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('telegram_post_links_v2.py')
          text = path.read_text(encoding='utf-8')
          if '\nimport json\n' not in text:
              text = text.replace('import html\n', 'import html\nimport json\n', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify collector startup path
        run: |
          python -m py_compile telegram_post_links_v2.py
          python - <<'PY'
          import telegram_post_links_v2 as module
          import monitor
          values = module._collector_sources(monitor)
          assert isinstance(values, set)
          assert 'kolesabb' in values
          print('collector source config loaded:', len(values))
          PY
          python -m telegram_post_links_v2

      - name: Run focused contracts
        run: python -m pytest -q tests/test_current_contracts.py

      - name: Commit verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegram_post_links_v2.py
          git commit -m 'Import JSON for Telegram collector cursor recovery'
          git push origin HEAD:fix/collector-json-import-20260725
