name: Telegram source intelligence
run-name: Source intelligence — ${{ github.event_name }}

on:
  push:
    branches: [main]
    paths:
      - "source_intelligence.py"
      - "source_intelligence_entry.py"
      - "source_intelligence_alerts.py"
      - "source_intelligence_retention.py"
      - "source_intelligence_reminder.py"
      - "bbvg/monitor/source_discovery.py"
      - "telegram_transport.py"
      - "notification_integrity_v2.py"
      - "bot_private_state.py"
      - "bot_notification_state.py"
      - "privacy_retention.py"
      - ".github/workflows/source-intelligence.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: betboom-source-intelligence
  cancel-in-progress: false

jobs:
  intelligence:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Load authoritative intelligence state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            +refs/heads/runtime-state:refs/remotes/origin/runtime-state
          if git show origin/runtime-state:intelligence_state.json \
              > intelligence_state.json.runtime.tmp; then
            python -m json.tool intelligence_state.json.runtime.tmp >/dev/null
            mv intelligence_state.json.runtime.tmp intelligence_state.json
          else
            rm -f intelligence_state.json.runtime.tmp
            echo "No runtime intelligence snapshot yet; using the main seed."
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check intelligence module
        env:
          BOT_TOKEN: "test-bot-token"
          BOT_STATE_KEY: "test-state-key"
          BOT_CHAT_ID: "1"
        run: |
          python -m py_compile monitor.py monitor_data.py source_intelligence.py source_intelligence_entry.py source_intelligence_alerts.py source_intelligence_retention.py source_intelligence_reminder.py bbvg/monitor/source_discovery.py telegram_transport.py notification_router.py notification_integrity_v2.py bot_notification_state.py bot_private_state.py privacy_retention.py
          python telegram_transport.py
          python notification_integrity_v2.py --self-test
          python bot_notification_state.py
          python source_intelligence_alerts.py
          python source_intelligence_retention.py
          python -m json.tool notification_delivery_state.json >/dev/null
          python self_test.py

      - name: Scan Telegram source network
        if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 18 * * *' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_STATE_KEY: ${{ secrets.BOT_STATE_KEY }}
          BOT_CHAT_ID: ${{ secrets.BOT_CHAT_ID }}
          TELEGRAM_WEB_DOMAIN: telegram.me
          DISPLAY_TIMEZONE: Asia/Barnaul
          REQUEST_TIMEOUT_SECONDS: "15"
          INTELLIGENCE_SOURCE_LIMIT: "250"
          INTELLIGENCE_CANDIDATE_LIMIT: "200"
          INTELLIGENCE_VERIFY_LIMIT: "150"
        run: python source_intelligence_entry.py

      - name: Repeat unresolved source alerts after 24 hours
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '7,22,37,52 * * * *' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_STATE_KEY: ${{ secrets.BOT_STATE_KEY }}
          BOT_CHAT_ID: ${{ secrets.BOT_CHAT_ID }}
          TELEGRAM_WEB_DOMAIN: telegram.me
          DISPLAY_TIMEZONE: Asia/Barnaul
        run: python source_intelligence_reminder.py

      - name: Save intelligence state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from runtime_state_publisher import publish_monitor_runtime

          result = publish_monitor_runtime(
              Path("intelligence_state.json"),
              token=os.environ["GITHUB_TOKEN"],
              repository=os.environ["GITHUB_REPOSITORY"],
          )
          print("Authoritative intelligence state published:", result)
          PY
