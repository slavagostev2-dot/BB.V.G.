name: Diagnose callback pytest gate

on:
  push:
    branches:
      - agent/control-center-callback-consolidation-20260725

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOT_TOKEN: test-bot-token
      BOT_STATE_KEY: test-state-key
      BOT_CHAT_ID: '1'
      ADMIN_USER_ID: '1'
      BBVG_TEST_MODE: '1'
      TELEGRAM_WEB_DOMAIN: telegram.me
      FINAL_REMINDER_BEFORE_MINUTES: '5'
      ACTIVE_REMOVE_GRACE_MINUTES: '0'
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/control-center-callback-consolidation-20260725
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Capture full pytest and coverage configuration
        shell: bash
        run: |
          set +e
          {
            echo '=== COVERAGE COMMAND REFERENCES ==='
            grep -RniE 'critical-core|coverage|pytest' .github/workflows scripts tests 2>/dev/null | head -n 500
            echo
            echo '=== FULL PYTEST ==='
            python -m pytest -q
            echo "PYTEST_EXIT=$?"
          } > engineering/CALLBACK_PYTEST_DIAGNOSTIC.txt 2>&1
          set -e

      - name: Commit diagnostic and remove workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/diagnose-callback-pytest.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engineering/CALLBACK_PYTEST_DIAGNOSTIC.txt
          git commit -m 'Record callback pytest gate diagnostic [skip ci]'
          git push origin HEAD:agent/control-center-callback-consolidation-20260725

