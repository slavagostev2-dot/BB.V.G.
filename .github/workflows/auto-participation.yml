name: BB V.G. targeted primary retry

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bb-vg-auto-participation
  cancel-in-progress: false

jobs:
  retry-primary:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout retry branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Load authoritative runtime state
        run: |
          git fetch origin runtime-state
          git show origin/runtime-state:state.json > state.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Retry zonertg8 for primary account only
        env:
          BETBOOM_AUTO_PARTICIPATE: "true"
          BETBOOM_STORAGE_STATE_JSON_PART1: ${{ secrets.BETBOOM_STORAGE_STATE_JSON_PART1 }}
          BETBOOM_STORAGE_STATE_JSON_PART2: ${{ secrets.BETBOOM_STORAGE_STATE_JSON_PART2 }}
          BETBOOM_BROWSER_CHANNEL: chrome
          BETBOOM_PARTICIPATION_TIMEOUT_MS: "30000"
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' | tee /tmp/bbvg-targeted-primary-retry.json
          import json

          import auto_participation_recovery as recovery
          import betboom_participation_browser
          import monitor

          state = recovery._json(monitor.STATE_PATH, {})
          if not isinstance(state, dict):
              raise SystemExit("Authoritative runtime state is unavailable")

          key = "zonertg8"
          item = (state.get("active_wheels") or {}).get(key)
          if not isinstance(item, dict):
              raise SystemExit("zonertg8 is no longer active")

          now = monitor.now_utc()
          deadline = monitor.parse_datetime(item.get("deadline"))
          if deadline is not None and now > deadline:
              raise SystemExit("zonertg8 deadline has passed")

          item = dict(item)
          item["wheel_key"] = key
          item["identifier"] = key
          item["url"] = monitor.normalize_url(str(item.get("url") or "https://betboom.ru/freestream/zonertg8"))

          token = recovery._event_token(item)
          exact = (state.get("auto_participation_events") or {}).get(token)
          if (
              isinstance(exact, dict)
              and str(exact.get("account_key") or "") == recovery.PRIMARY_ACCOUNT_KEY
              and str(exact.get("status") or "").casefold() in recovery.SUCCESS_STATUSES
          ):
              print(json.dumps({"success": True, "status": "already_participating", "event_token": token}, ensure_ascii=False))
              raise SystemExit(0)

          result = betboom_participation_browser.participate(item["url"])
          attempt = {
              **item,
              "success": bool(result.success),
              "status": str(result.status),
              "detail": str(result.detail)[:300],
              "artifact_url": result.artifact_url,
          }
          recovery._restore_runtime_state(state, [item], [attempt], now)
          print(json.dumps({
              "success": bool(result.success),
              "status": str(result.status),
              "detail": str(result.detail)[:300],
              "event_token": token,
          }, ensure_ascii=False))
          if not result.success:
              raise SystemExit("Primary participation was not confirmed")
          PY

      - name: Publish confirmed runtime state
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          BBVG_RUNTIME_STATE_BRANCH: runtime-state
        run: python runtime_state_publish.py --publish-runtime-state state.json

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bbvg-targeted-primary-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/
          if-no-files-found: ignore
          retention-days: 7
