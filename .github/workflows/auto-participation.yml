name: BB V.G. targeted retry for unconfirmed accounts

on:
  push:
    branches:
      - ops/retry-kekw-primary-xflar

permissions:
  contents: read

concurrency:
  group: bb-vg-auto-participation
  cancel-in-progress: false

jobs:
  retry-unconfirmed:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Load authoritative runtime state
        run: |
          git fetch origin runtime-state
          git show origin/runtime-state:state.json > state.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Retry kekw19082 for primary and xFLARXx
        env:
          BETBOOM_AUTO_PARTICIPATE: "true"
          BETBOOM_STORAGE_STATE_JSON_PART1: ${{ secrets.BETBOOM_STORAGE_STATE_JSON_PART1 }}
          BETBOOM_STORAGE_STATE_JSON_PART2: ${{ secrets.BETBOOM_STORAGE_STATE_JSON_PART2 }}
          BETBOOM_STORAGE_STATE_JSON_PART5: ${{ secrets.BETBOOM_STORAGE_STATE_JSON_PART5 }}
          BETBOOM_STORAGE_STATE_JSON_PART6: ${{ secrets.BETBOOM_STORAGE_STATE_JSON_PART6 }}
          BETBOOM_ACCOUNT3_LABEL: "xFLARXx"
          BETBOOM_ACCOUNT3_TELEGRAM_USER: "xFLARXx"
          BETBOOM_BROWSER_CHANNEL: chrome
          BETBOOM_PARTICIPATION_TIMEOUT_MS: "30000"
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' | tee /tmp/bbvg-kekw-targeted-retry.json
          import json
          from pathlib import Path

          import auto_participation_recovery as recovery
          import betboom_participation_browser
          import monitor
          import xflarxx_account_participation

          state = recovery._json(monitor.STATE_PATH, {})
          if not isinstance(state, dict):
              raise SystemExit("Authoritative runtime state is unavailable")

          key = "kekw19082"
          item = (state.get("active_wheels") or {}).get(key)
          if not isinstance(item, dict):
              raise SystemExit("kekw19082 is no longer active")

          now = monitor.now_utc()
          deadline = monitor.parse_datetime(item.get("deadline"))
          if deadline is not None and now > deadline:
              raise SystemExit("kekw19082 deadline has passed")

          item = dict(item)
          item["wheel_key"] = key
          item["identifier"] = key
          item["url"] = monitor.normalize_url(str(item.get("url") or "https://betboom.ru/freestream/kekw19082"))
          token = recovery._event_token(item)

          exact = (state.get("auto_participation_events") or {}).get(token)
          primary_ok = (
              isinstance(exact, dict)
              and str(exact.get("account_key") or "") == recovery.PRIMARY_ACCOUNT_KEY
              and str(exact.get("status") or "").casefold() in recovery.SUCCESS_STATUSES
          )
          primary_result = None
          if not primary_ok:
              primary_result = betboom_participation_browser.participate(item["url"])
              attempt = {
                  **item,
                  "success": bool(primary_result.success),
                  "status": str(primary_result.status),
                  "detail": str(primary_result.detail)[:300],
                  "artifact_url": primary_result.artifact_url,
              }
              recovery._restore_runtime_state(state, [item], [attempt], now)

          recovery_file = Path("/tmp/bbvg-kekw-recovery.json")
          recovery_file.write_text(json.dumps({"checked": []}), encoding="utf-8")
          xflar_summary = xflarxx_account_participation.run_account(recovery_file)

          final_state = recovery._json(monitor.STATE_PATH, {})
          records = final_state.get("auto_participation_events") or {}
          primary = records.get(token) or {}
          xflar = records.get(f"{token}#account:xflarxx_primary") or {}
          success_statuses = recovery.SUCCESS_STATUSES
          primary_status = str(primary.get("status") or "").casefold()
          xflar_status = str(xflar.get("status") or "").casefold()
          output = {
              "event_token": token,
              "primary_status": primary_status,
              "primary_detail": str(primary.get("detail") or "")[:300],
              "xflar_status": xflar_status,
              "xflar_detail": str(xflar.get("detail") or "")[:300],
              "xflar_summary": xflar_summary,
          }
          print(json.dumps(output, ensure_ascii=False))
          if primary_status not in success_statuses or xflar_status not in success_statuses:
              raise SystemExit("Not every targeted account received exact BetBoom confirmation")
          PY

      - name: Publish retry state
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          BBVG_RUNTIME_STATE_BRANCH: runtime-state
        run: python runtime_state_publish.py --publish-runtime-state state.json

      - name: Upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bbvg-kekw-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/
          if-no-files-found: ignore
          retention-days: 30
