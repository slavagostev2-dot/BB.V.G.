name: Apply inactive wheel diagnostic patch

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply_inactive_wheel_diagnostic_patch.py"
      - ".github/workflows/apply-inactive-wheel-diagnostic-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/show-inactive-wheel-diagnostic-20260725
          fetch-depth: 0

      - name: Apply focused patch
        run: python scripts/apply_inactive_wheel_diagnostic_patch.py

      - name: Commit diagnostic and regression test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin_panel_v2.py tests/test_inactive_wheel_diagnostic.py
          git commit -m "Show inactive wheel history in diagnostics"
          git push origin HEAD:agent/show-inactive-wheel-diagnostic-20260725
