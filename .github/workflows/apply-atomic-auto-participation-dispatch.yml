name: Apply atomic auto participation dispatch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'fix/atomic-auto-participation-dispatch-20260725' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BOT_TOKEN: test-bot-token
      BOT_STATE_KEY: test-state-key
      BOT_CHAT_ID: '1'
      ADMIN_USER_ID: '1'
      BBVG_TEST_MODE: '1'
      TELEGRAM_WEB_DOMAIN: telegram.me
      FINAL_REMINDER_BEFORE_MINUTES: '5'
      ACTIVE_REMOVE_GRACE_MINUTES: '0'
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/atomic-auto-participation-dispatch-20260725
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Align patch with current dispatcher
        run: python scripts/prepare_atomic_dispatch_patch_v3.py

      - name: Repair generated notification quotes
        run: python scripts/fix_atomic_notification_quote_generation.py

      - name: Repair dispatcher self-test
        run: python scripts/fix_atomic_dispatch_payload_self_test.py

      - name: Apply atomic dispatch patch
        run: python scripts/apply_atomic_auto_participation_dispatch.py

      - name: Remove temporary files before validation
        run: |
          git rm -f --ignore-unmatch \
            scripts/apply_atomic_auto_participation_dispatch.py \
            scripts/prepare_atomic_dispatch_patch_v2.py \
            scripts/prepare_atomic_dispatch_patch_v3.py \
            scripts/fix_prepare_atomic_dispatch_quotes.py \
            scripts/fix_atomic_notification_quote_generation.py \
            scripts/fix_atomic_dispatch_payload_self_test.py \
            scripts/auto_participation_dispatch_atomic_payload.txt \
            .github/workflows/apply-atomic-auto-participation-dispatch.yml \
            scripts/.atomic-dispatch-pr-trigger \
            docs/.atomic-dispatch-pr-ready \
            docs/.create-pr-marker \
            engineering/ATOMIC_DISPATCH_VALIDATION.txt

      - name: Compile changed modules
        run: python -m py_compile monitor.py wheel_event_runtime.py auto_participation_dispatch.py tests/test_current_contracts.py

      - name: Validate atomic dispatcher and publish exact error
        shell: bash
        run: |
          set +e
          python auto_participation_dispatch.py --self-test 2>&1 | tee /tmp/atomic-dispatch-self-test.log
          code=${PIPESTATUS[0]}
          set -e
          if [[ "$code" -ne 0 ]]; then
            cp /tmp/atomic-dispatch-self-test.log /tmp/atomic-dispatch-self-test-copy.log
            git reset --hard HEAD
            mkdir -p engineering
            cat /tmp/atomic-dispatch-self-test-copy.log > engineering/ATOMIC_DISPATCH_VALIDATION.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add engineering/ATOMIC_DISPATCH_VALIDATION.txt
            git commit -m 'Record atomic dispatcher self-test diagnostic [skip ci]'
            git push origin HEAD:fix/atomic-auto-participation-dispatch-20260725
            exit "$code"
          fi

      - name: Validate wheel event lifecycle
        run: python wheel_event_runtime.py

      - name: Validate reminder dispatcher
        run: python personal_reminder_filter.py

      - name: Run focused pytest contracts
        run: python -m pytest -q tests/test_current_contracts.py tests/test_production_stability_guardrails.py tests/test_telegram_start_state_safety.py

      - name: Run full repository tests
        run: python -m pytest -q

      - name: Commit clean verified change
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make auto participation dispatch atomic with notification delivery'
          git push origin HEAD:fix/atomic-auto-participation-dispatch-20260725
