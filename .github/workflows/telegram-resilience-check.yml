name: Telegram transport checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "telegram_transport.py"
      - "telegram_post_links_v2.py"
      - "telegram_private_sources.py"
      - "recurring_wheel_events.py"
      - "wheel_event_runtime.py"
      - "wheel_metadata_quality.py"
      - "bbvg_monitor_main.py"
      - ".github/workflows/telegram-resilience-check.yml"
  workflow_dispatch:
    inputs:
      api_probe_source:
        description: "Optional @username to read directly through the authorized Telegram API session"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate telegram.me transport layer
        env:
          TELEGRAM_WEB_DOMAIN: telegram.me
        run: |
          python -m py_compile telegram_transport.py telegram_post_links_v2.py telegram_private_sources.py recurring_wheel_events.py wheel_event_runtime.py wheel_metadata_quality.py bbvg_monitor_main.py monitor.py monitor_data.py bbvg_monitor_runtime.py
          python telegram_transport.py
          python telegram_post_links_v2.py
          python recurring_wheel_events.py
          python wheel_event_runtime.py
          python wheel_metadata_quality.py
          python - <<'PY'
          import bbvg_monitor_main as runtime
          import recurring_wheel_events
          import telegram_post_links_v2
          import telegram_private_sources
          import telegram_transport
          import wheel_metadata_quality

          assert runtime.monitor.fetch_all_sources.__module__ == "telegram_transport"
          assert runtime.monitor.fetch_public_channel.__module__ == "telegram_post_links_v2"
          assert runtime.monitor._bbvg_telegram_transport_installed is True
          assert runtime.monitor._bbvg_telegram_button_links_installed is True
          assert runtime.monitor._bbvg_recurring_wheel_events_installed is True
          assert runtime.monitor._bbvg_wheel_event_runtime_installed is True
          assert runtime.monitor._bbvg_wheel_metadata_quality_installed is True
          assert runtime.monitor.FRESH_UNKNOWN_POST_MINUTES >= 360
          assert runtime.monitor.TELEGRAM_WEB_DOMAIN == "telegram.me"
          assert telegram_transport.public_source_url("test") == "https://telegram.me/s/test"
          assert telegram_transport.rewrite_telegram_url("https://t.me/test/1") == "https://telegram.me/test/1"
          assert telegram_transport.is_transient_transport_error(
              "NameResolutionError: Failed to resolve telegram.me"
          )
          assert telegram_post_links_v2.MINIMUM_FRESH_UNKNOWN_MINUTES == 360
          telegram_private_sources.self_test()

          messages = runtime.monitor.fetch_public_channel("jestercast")
          assert messages, "Live @jestercast public preview returned no messages"
          assert all(message.message_id > 0 for message in messages)
          assert all(message.date is not None for message in messages)
          print("telegram.me parser and timed-source preservation checks passed")
          PY

      - name: Probe one source through authenticated Telegram API
        if: github.event_name == 'workflow_dispatch' && inputs.api_probe_source != ''
        env:
          API_PROBE_SOURCE: ${{ inputs.api_probe_source }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
          TELEGRAM_PRIVATE_SOURCE_LIMIT: "20"
        run: |
          python - <<'PY'
          import os

          import bbvg_monitor_main as runtime
          import telegram_private_sources

          alias = os.environ.get("API_PROBE_SOURCE", "").strip().lstrip("@")
          if not alias:
              print("authenticated_api_probe status=invalid_source")
              raise SystemExit(2)

          results, errors, empty = telegram_private_sources.fetch_authenticated_public_sources(
              runtime.monitor,
              [alias],
          )
          messages = results.get(alias, [])
          if messages:
              print(
                  "authenticated_api_probe "
                  f"status=ok source=@{alias} messages={len(messages)} "
                  f"latest_message_id={messages[-1].message_id}"
              )
              raise SystemExit(0)
          if alias in empty:
              print(f"authenticated_api_probe status=empty source=@{alias}")
              raise SystemExit(3)
          if errors:
              print(f"authenticated_api_probe status=error source=@{alias}")
              raise SystemExit(4)
          print(f"authenticated_api_probe status=no_result source=@{alias}")
          raise SystemExit(5)
          PY
