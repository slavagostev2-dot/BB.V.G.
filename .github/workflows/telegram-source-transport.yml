name: Verify configured Telegram source transport

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-source-transport.yml"
      - "source_transport_smoke.py"
      - "telegram_private_sources.py"
      - "public_sources.txt"
  workflow_dispatch:
    inputs:
      api_probe_source:
        description: "Optional @username to verify through the authorized Telegram API session"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "17 3 * * *"
  workflow_run:
    workflows: ["Telegram candidate discovery"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bb-vg-source-transport-smoke
  cancel-in-progress: true

jobs:
  activate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate approved source pool
        env:
          TELEGRAM_WEB_DOMAIN: telegram.me
        run: |
          python preflight.py
          python -m py_compile source_transport_smoke.py telegram_transport.py telegram_private_sources.py bbvg_monitor_main.py monitor_health.py

      - name: Check all configured sources through production transport
        id: smoke
        continue-on-error: true
        env:
          TELEGRAM_WEB_DOMAIN: telegram.me
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
          TELEGRAM_PRIVATE_SOURCES_JSON: ${{ secrets.TELEGRAM_PRIVATE_SOURCES_JSON }}
          TELEGRAM_PRIVATE_SOURCE_LIMIT: "40"
          REQUEST_TIMEOUT_SECONDS: "15"
          MAX_WORKERS: "16"
          TRANSPORT_BATCH_ATTEMPTS: "3"
          BOT_FEEDBACK_ENABLED: "false"
          AUTO_RUN: "false"
          MANUAL_RUN: "false"
        run: python source_transport_smoke.py

      - name: Probe authenticated Telegram API source
        id: api_probe
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.api_probe_source != '')
        env:
          API_PROBE_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.api_probe_source || 'bbwheel' }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
          TELEGRAM_PRIVATE_SOURCE_LIMIT: "20"
        run: |
          python - <<'PY'
          import os

          import bbvg_monitor_main as runtime
          import telegram_private_sources

          alias = os.environ.get("API_PROBE_SOURCE", "").strip().lstrip("@")
          if not alias:
              print("authenticated_api_probe status=invalid_source")
              raise SystemExit(2)

          results, errors, empty = telegram_private_sources.fetch_authenticated_public_sources(
              runtime.monitor,
              [alias],
          )
          messages = results.get(alias, [])
          if messages:
              print(
                  "authenticated_api_probe "
                  f"status=ok source=@{alias} messages={len(messages)} "
                  f"latest_message_id={messages[-1].message_id}"
              )
              raise SystemExit(0)
          if alias in empty:
              print(f"authenticated_api_probe status=empty source=@{alias}")
              raise SystemExit(3)
          if errors:
              print(f"authenticated_api_probe status=error source=@{alias}")
              raise SystemExit(4)
          print(f"authenticated_api_probe status=no_result source=@{alias}")
          raise SystemExit(5)
          PY

      - name: Release stale public-feed quarantine after API proof
        if: steps.api_probe.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          API_PROBE_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.api_probe_source || 'bbwheel' }}
        shell: bash
        run: |
          set -euo pipefail
          alias="${API_PROBE_SOURCE#@}"
          alias=$(printf '%s' "$alias" | tr '[:upper:]' '[:lower:]')
          tmp=$(mktemp)
          raw=$(mktemp)
          changed_file=$(mktemp)

          meta=$(gh api "/repos/${GITHUB_REPOSITORY}/contents/source_health.json?ref=runtime-state")
          sha=$(printf '%s' "$meta" | jq -r '.sha')
          printf '%s' "$meta" | jq -r '.content' | tr -d '\n' | base64 -d > "$raw"

          python - "$raw" "$tmp" "$changed_file" "$alias" <<'PY'
          import json
          import sys

          source_path, output_path, changed_path, wanted = sys.argv[1:]
          with open(source_path, encoding="utf-8") as stream:
              data = json.load(stream)
          sources = data.get("sources") if isinstance(data, dict) else None
          if not isinstance(sources, dict):
              raise SystemExit("source_health.json has no sources mapping")

          matched = None
          for name, entry in sources.items():
              if str(name).casefold() == wanted.casefold() and isinstance(entry, dict):
                  matched = entry
                  break
          if matched is None:
              raise SystemExit(f"source @{wanted} is absent from runtime health")

          changed = False
          if (
              str(matched.get("status") or "") == "quarantined"
              and str(matched.get("failure_code") or "") == "empty_public_feed"
          ):
              matched["status"] = "unknown"
              matched["consecutive_empty"] = 0
              for field in (
                  "quarantined_at",
                  "next_recheck_at",
                  "failure_code",
                  "failure_reason",
                  "last_error",
              ):
                  matched.pop(field, None)
              changed = True

          with open(output_path, "w", encoding="utf-8") as stream:
              json.dump(data, stream, ensure_ascii=False, indent=2, sort_keys=True)
              stream.write("\n")
          with open(changed_path, "w", encoding="utf-8") as stream:
              stream.write("yes" if changed else "no")
          print(
              f"authenticated_api_quarantine_release source=@{wanted} "
              f"changed={'yes' if changed else 'no'}"
          )
          PY

          if [ "$(cat "$changed_file")" != "yes" ]; then
            exit 0
          fi

          encoded=$(base64 -w0 "$tmp")
          gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/source_health.json" \
            -f message="Release stale public-feed quarantine after authenticated API proof [skip ci]" \
            -f content="$encoded" \
            -f sha="$sha" \
            -f branch=runtime-state >/dev/null

      - name: Save transport verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          files=(source_transport_state.json)
          test -f source_transport_state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Record verified source transport [skip ci]" || true
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1

      - name: Fail if transport verification failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
