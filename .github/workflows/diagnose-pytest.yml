name: Diagnose pytest failure

on:
  pull_request:
    paths:
      - "bbvg_monitor_runtime.py"
      - ".github/workflows/diagnose-pytest.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-cov
      - name: Capture pytest output
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q --tb=short > pytest-output.txt 2>&1
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-output
          path: pytest-output.txt
          if-no-files-found: error
      - name: Preserve failure
        if: steps.pytest.outcome == 'failure'
        run: exit 1
