name: Apply callback consolidation

on:
  push:
    branches:
      - agent/control-center-callback-consolidation-20260725

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout working branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/control-center-callback-consolidation-20260725
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Apply atomic source patch
        run: python scripts/apply_callback_consolidation.py

      - name: Validate callback ownership and compatibility
        env:
          BOT_TOKEN: test-bot-token
          BOT_STATE_KEY: test-state-key
          BOT_CHAT_ID: '1'
          ADMIN_USER_ID: '1'
          BBVG_TEST_MODE: '1'
        run: |
          python -m py_compile bbvg/bot/wheels.py admin_panel_runtime_v41.py notification_button_recovery.py
          python -m bbvg.bot.wheels
          python admin_panel_runtime_v41.py --self-test
          python notification_button_recovery.py --self-test
          python -m pytest -q tests/test_production_stability_guardrails.py tests/test_current_contracts.py

      - name: Commit consolidated implementation
        run: |
          set -euo pipefail
          git rm scripts/apply_callback_consolidation.py .github/workflows/apply-callback-consolidation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bbvg/bot/wheels.py admin_panel_runtime_v41.py notification_button_recovery.py tests/test_production_stability_guardrails.py engineering/REFACTOR_PLAN_RU.md
          git commit -m 'Consolidate Control Center participation callbacks'
          git push origin HEAD:agent/control-center-callback-consolidation-20260725
