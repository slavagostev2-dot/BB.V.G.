name: Apply stale recovery notification expiry

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && github.head_ref == 'agent/stale-recovery-notification-expiry-20260725' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOT_TOKEN: test-bot-token
      BOT_STATE_KEY: test-state-key
      BOT_CHAT_ID: '1'
      ADMIN_USER_ID: '1'
      BBVG_TEST_MODE: '1'
      TELEGRAM_WEB_DOMAIN: telegram.me
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/stale-recovery-notification-expiry-20260725
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Apply expiry patch
        run: python scripts/apply_stale_recovery_notification_expiry.py

      - name: Remove temporary automation
        run: |
          git rm -f --ignore-unmatch scripts/apply_stale_recovery_notification_expiry.py .github/workflows/apply-stale-recovery-expiry.yml

      - name: Validate expiry and repository
        run: |
          python -m py_compile incident_manager.py tests/test_periodic_outage_root_fix.py
          python -m pytest -q tests/test_periodic_outage_root_fix.py tests/test_current_contracts.py tests/test_production_stability_guardrails.py
          python -m pytest -q

      - name: Commit clean implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expire stale recovery notifications before delivery'
          git push origin HEAD:agent/stale-recovery-notification-expiry-20260725
