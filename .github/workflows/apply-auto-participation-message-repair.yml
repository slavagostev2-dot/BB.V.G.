name: Apply exact auto participation message repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' && github.head_ref == 'agent/auto-participation-consistency-20260725' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOT_TOKEN: test-bot-token
      BOT_STATE_KEY: test-state-key
      BOT_CHAT_ID: '1'
      ADMIN_USER_ID: '1'
      BBVG_TEST_MODE: '1'
      TELEGRAM_WEB_DOMAIN: telegram.me
      FINAL_REMINDER_BEFORE_MINUTES: '5'
      ACTIVE_REMOVE_GRACE_MINUTES: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/auto-participation-consistency-20260725
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and apply repair
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/repair_auto_participation_result_message.py
          git rm scripts/repair_auto_participation_result_message.py
      - name: Compile every active Python module
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|state_api|docs)(/|$)' .
      - name: Validate outcome merge
        id: merge_test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python auto_participation_bot_sync.py --self-test 2>&1 | tee /tmp/merge-test.log
          code=${PIPESTATUS[0]}
          set -e
          exit "$code"
      - name: Publish outcome merge diagnostic
        if: ${{ steps.merge_test.outcome == 'failure' }}
        run: |
          set -euo pipefail
          cp /tmp/merge-test.log /tmp/diagnostic.txt
          git reset --hard HEAD
          mkdir -p engineering
          cat /tmp/diagnostic.txt > engineering/AUTO_PARTICIPATION_CONSISTENCY_DIAGNOSTIC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engineering/AUTO_PARTICIPATION_CONSISTENCY_DIAGNOSTIC.txt
          git commit -m 'Record auto participation merge diagnostic [skip ci]'
          git push origin HEAD:agent/auto-participation-consistency-20260725
          exit 1
      - name: Validate remaining contracts
        run: |
          python auto_participation_recovery.py --self-test
          python auto_participation_notifications.py
          python betboom_participation_browser.py
          python -m pytest -q
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch scripts/.auto-participation-consistency-trigger scripts/adjust_auto_participation_consistency_patch.py engineering/AUTO_PARTICIPATION_CONSISTENCY_DIAGNOSTIC.txt
          git add -A
          git commit -m 'Repair auto participation result message rendering'
          git push origin HEAD:agent/auto-participation-consistency-20260725
