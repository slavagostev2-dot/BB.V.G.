name: Diagnose kolesaBB freshness

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.head_ref == 'diagnostic/kolesabb-cache-20260725' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BOT_TOKEN: test-bot-token
      BOT_STATE_KEY: test-state-key
      BOT_CHAT_ID: '1'
      ADMIN_USER_ID: '1'
      BBVG_TEST_MODE: '1'
      TELEGRAM_WEB_DOMAIN: telegram.me
      FINAL_REMINDER_BEFORE_MINUTES: '5'
      ACTIVE_REMOVE_GRACE_MINUTES: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run production and full-day gap diagnostic
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/diagnose_today_wheels.py | tee /tmp/kolesabb-diagnostic.txt

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: kolesabb-diagnostic
          path: /tmp/kolesabb-diagnostic.txt
          if-no-files-found: error
