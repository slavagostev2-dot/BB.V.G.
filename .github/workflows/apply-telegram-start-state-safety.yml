name: Apply Telegram start and state safety

on:
  push:
    branches:
      - agent/telegram-start-state-safety-20260725

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BOT_TOKEN: test-bot-token
      BOT_STATE_KEY: test-state-key
      BOT_CHAT_ID: '1'
      ADMIN_USER_ID: '1'
      BBVG_TEST_MODE: '1'
      TELEGRAM_WEB_DOMAIN: telegram.me
      FINAL_REMINDER_BEFORE_MINUTES: '5'
      ACTIVE_REMOVE_GRACE_MINUTES: '0'
    steps:
      - name: Checkout safety branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/telegram-start-state-safety-20260725
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Apply guarded Telegram state patch
        run: python scripts/apply_telegram_start_state_safety.py

      - name: Remove temporary automation before validation
        run: git rm scripts/apply_telegram_start_state_safety.py .github/workflows/apply-telegram-start-state-safety.yml

      - name: Validate start, state and full repository
        run: |
          python -m py_compile admin_panel_v2.py scripts/telegram_start_state_smoke.py tests/test_telegram_start_state_safety.py
          python scripts/telegram_start_state_smoke.py
          python -m pytest -q tests/test_telegram_start_state_safety.py tests/test_button_matrix.py tests/test_production_stability_guardrails.py tests/test_current_contracts.py
          python -m pytest -q

      - name: Commit clean safety implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin_panel_v2.py scripts/validate_control_center.sh scripts/telegram_start_state_smoke.py tests/test_telegram_start_state_safety.py engineering/PRODUCTION_STABILITY_POLICY_RU.md docs/PROJECT_CHANGELOG_RU.md
          git commit -m 'Prevent silent zero Telegram state and guarantee start response'
          git push origin HEAD:agent/telegram-start-state-safety-20260725
