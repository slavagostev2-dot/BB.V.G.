name: Apply participation diagnostics patch

on:
  push:
    branches:
      - fix/participation-network-and-wheel-sources
    paths:
      - .github/workflows/apply-participation-diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/participation-network-and-wheel-sources
          fetch-depth: 1

      - name: Apply exact source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Browser: attach a secret-safe BetBoom XHR/fetch trace only around
          # the participation attempt. It observes; it does not change click/retry logic.
          replace_once(
              "betboom_participation_browser.py",
              "import betboom_auto_participation as auto\n",
              "import betboom_auto_participation as auto\nimport betboom_network_diagnostics as network_diag\n",
          )
          replace_once(
              "betboom_participation_browser.py",
              "    page: Any = None\n    try:\n",
              "    page: Any = None\n    network_trace: list[dict[str, Any]] = []\n    try:\n",
          )
          replace_once(
              "betboom_participation_browser.py",
              "            clicked, location, preparations, preexisting = _find_and_click(\n                page, timeout_ms\n            )\n",
              "            network_trace = network_diag.attach(page)\n            clicked, location, preparations, preexisting = _find_and_click(\n                page, timeout_ms\n            )\n",
          )
          replace_once(
              "betboom_participation_browser.py",
              "                    artifact = _finish_click_proof(\n                        page,\n                        proof_target,\n                        url=url,\n                        click_location=location,\n                        confirmation=confirmation,\n                        status=\"participated\",\n                    )\n                    browser.close()\n",
              "                    artifact = _finish_click_proof(\n                        page,\n                        proof_target,\n                        url=url,\n                        click_location=location,\n                        confirmation=confirmation,\n                        status=\"participated\",\n                    )\n                    network_diag.write_trace(artifact, network_trace)\n                    browser.close()\n",
          )
          # There are two participated proof blocks; patch the remaining reload one.
          replace_once(
              "betboom_participation_browser.py",
              "                    artifact = _finish_click_proof(\n                        page,\n                        proof_target,\n                        url=url,\n                        click_location=location,\n                        confirmation=confirmation,\n                        status=\"participated\",\n                    )\n                    browser.close()\n",
              "                    artifact = _finish_click_proof(\n                        page,\n                        proof_target,\n                        url=url,\n                        click_location=location,\n                        confirmation=confirmation,\n                        status=\"participated\",\n                    )\n                    network_diag.write_trace(artifact, network_trace)\n                    browser.close()\n",
          )
          replace_once(
              "betboom_participation_browser.py",
              "            artifact = _finish_click_proof(\n                page,\n                proof_target,\n                url=url,\n                click_location=location,\n                confirmation=\"not_found\",\n                status=\"unconfirmed\",\n            )\n            browser.close()\n",
              "            artifact = _finish_click_proof(\n                page,\n                proof_target,\n                url=url,\n                click_location=location,\n                confirmation=\"not_found\",\n                status=\"unconfirmed\",\n            )\n            network_diag.write_trace(artifact, network_trace)\n            browser.close()\n",
          )
          replace_once(
              "betboom_participation_browser.py",
              "        artifact = _save_diagnostics(page, url, \"technical_error\", detail)\n        return auto.ParticipationResult(\n",
              "        artifact = _save_diagnostics(page, url, \"technical_error\", detail)\n        network_diag.write_trace(artifact, network_trace)\n        return auto.ParticipationResult(\n",
          )
          replace_once(
              "betboom_participation_browser.py",
              "    assert PROMO_DETAILS_RE not in _preparation_patterns()\n",
              "    assert PROMO_DETAILS_RE not in _preparation_patterns()\n    network_diag.self_test()\n",
          )

          # Recovery: preserve every independent source publication encountered
          # during the scan instead of retaining only the newest candidate record.
          replace_once(
              "auto_participation_recovery.py",
              "def _restore_runtime_state(\n    state: dict[str, Any],\n    active: list[dict[str, Any]],\n    attempts: list[dict[str, Any]],\n    scanned_at: Any,\n) -> None:\n",
              "def _restore_runtime_state(\n    state: dict[str, Any],\n    active: list[dict[str, Any]],\n    attempts: list[dict[str, Any]],\n    scanned_at: Any,\n    discovered_publications: dict[str, list[dict[str, Any]]] | None = None,\n) -> None:\n",
          )
          replace_once(
              "auto_participation_recovery.py",
              "        _ensure_button_context(state, entry, item)\n\n        attempt = attempts_by_key.get(key)\n",
              "        publication_rows = (discovered_publications or {}).get(key, [])\n        if publication_rows:\n            collection = state.setdefault(\"wheel_publications\", {})\n            merged = wheel_publications_v2.merge_publications(\n                collection.get(key, []),\n                publication_rows,\n                reset_event=False,\n            )\n            if merged:\n                collection[key] = merged\n            sources = wheel_publications_v2.publication_sources(state, key, entry)\n            if sources:\n                entry[\"sources\"] = sources\n        _ensure_button_context(state, entry, item)\n\n        attempt = attempts_by_key.get(key)\n",
          )
          replace_once(
              "auto_participation_recovery.py",
              "    candidates = _persisted_active_candidates(persisted, now)\n    for source, messages in results.items():\n",
              "    candidates = _persisted_active_candidates(persisted, now)\n    discovered_publications: dict[str, list[dict[str, Any]]] = {}\n    for source, messages in results.items():\n",
          )
          replace_once(
              "auto_participation_recovery.py",
              "                record = {\n                    \"wheel_key\": key,\n                    \"url\": monitor.normalize_url(link),\n                    \"source\": source,\n                    \"message_id\": message.message_id,\n                    \"message_date\": published.isoformat(),\n                    \"message_url\": message.message_url,\n                    \"message_text\": str(message.text or \"\")[:4000],\n                }\n                if current is None or record[\"message_date\"] > current[\"message_date\"]:\n",
              "                record = {\n                    \"wheel_key\": key,\n                    \"url\": monitor.normalize_url(link),\n                    \"source\": source,\n                    \"message_id\": message.message_id,\n                    \"message_date\": published.isoformat(),\n                    \"message_url\": message.message_url,\n                    \"message_text\": str(message.text or \"\")[:4000],\n                }\n                discovered_publications.setdefault(key, []).append(\n                    {\n                        \"source\": source,\n                        \"message_id\": message.message_id,\n                        \"message_date\": published.isoformat(),\n                        \"message_url\": message.message_url,\n                    }\n                )\n                if current is None or record[\"message_date\"] > current[\"message_date\"]:\n",
          )
          replace_once(
              "auto_participation_recovery.py",
              "    _restore_runtime_state(persisted, active, attempts, now)\n",
              "    _restore_runtime_state(\n        persisted, active, attempts, now, discovered_publications\n    )\n",
          )
          replace_once(
              "auto_participation_recovery.py",
              "    assert _notification_already_recorded(\n        notification_state,\n        \"old\",\n        {\"message_date\": \"2026-07-21T10:01:00+00:00\"},\n    )\n    print(\"auto participation recovery authoritative-outcome self-test passed\")\n",
              "    assert _notification_already_recorded(\n        notification_state,\n        \"old\",\n        {\"message_date\": \"2026-07-21T10:01:00+00:00\"},\n    )\n    source_state = {\n        \"active_wheels\": {\n            \"kekw2\": {\n                \"wheel_key\": \"kekw2\",\n                \"identifier\": \"kekw2\",\n                \"source\": \"shadowkek\",\n                \"url\": \"https://betboom.ru/freestream/kekw2\",\n                \"deadline\": \"2026-09-06T14:26:55.304000+00:00\",\n                \"server_start_at\": \"2026-09-06T13:46:55.304000+00:00\",\n            }\n        },\n        \"wheel_publications\": {\n            \"kekw2\": [\n                {\"source\": \"shadowkek\", \"message_id\": 1}\n            ]\n        },\n        \"participating_wheels\": {},\n        \"auto_participation_events\": {},\n    }\n    source_item = dict(source_state[\"active_wheels\"][\"kekw2\"] )\n    source_item[\"action_id\"] = 2011\n    source_item[\"message_date\"] = \"2026-09-06T13:48:39+00:00\"\n    _restore_runtime_state(\n        source_state,\n        [source_item],\n        [],\n        _Moment(),\n        {\n            \"kekw2\": [\n                {\"source\": \"burdakekw\", \"message_id\": 5911},\n                {\"source\": \"private_2445382077\", \"message_id\": 7805},\n            ]\n        },\n    )\n    assert source_state[\"active_wheels\"][\"kekw2\"][\"sources\"] == [\n        \"shadowkek\",\n        \"burdakekw\",\n        \"private_2445382077\",\n    ]\n    print(\"auto participation recovery authoritative-outcome self-test passed\")\n",
          )

          # Active wheels screen: render the aggregated publication ledger and
          # keep the synthetic private source id out of user-facing text.
          replace_once(
              "bbvg/bot/wheels.py",
              "    @staticmethod\n    def _wheel_digest(key: str) -> str:\n",
              "    @staticmethod\n    def _source_text(sources: list[str], primary_source: str) -> str:\n        if primary_source == _MANUAL_SUBMISSION_SOURCE and not sources:\n            return \"📡 Добавлено через бот BB V.G.\"\n        if not sources:\n            return \"📡 Источник неизвестен\"\n        labels: list[str] = []\n        private_added = False\n        for source in sources:\n            if source.casefold().startswith(\"private_\"):\n                if not private_added:\n                    labels.append(\"закрытый Telegram-канал\")\n                    private_added = True\n                continue\n            labels.append(f\"@{html.escape(source)}\")\n        if not labels:\n            return \"📡 Источник неизвестен\"\n        prefix = \"Источник\" if len(labels) == 1 else \"Источники\"\n        return f\"📡 {prefix}: \" + \", \".join(labels)\n\n    @staticmethod\n    def _wheel_digest(key: str) -> str:\n",
          )
          replace_once(
              "bbvg/bot/wheels.py",
              "            source = str(item.get(\"source\") or \"неизвестно\")\n            source_text = (\n                \"📡 Добавлено через бот BB V.G.\"\n                if source == _MANUAL_SUBMISSION_SOURCE\n                else f\"📡 @{html.escape(source)}\"\n            )\n",
              "            primary_source = str(item.get(\"source\") or \"\")\n            sources = self._sources_for_item(snap, key, item)\n            source_text = self._source_text(sources, primary_source)\n",
          )
          replace_once(
              "bbvg/bot/wheels.py",
              "    assert \"wheel:part:\" in WheelInteractionRuntime.handle_callback.__code__.co_consts\n    print(\"BB V.G. wheel interaction subsystem self-test passed\")\n",
              "    assert \"wheel:part:\" in WheelInteractionRuntime.handle_callback.__code__.co_consts\n    source_line = panel._source_text(\n        [\"shadowkek\", \"burdakekw\", \"private_2445382077\"],\n        \"shadowkek\",\n    )\n    assert \"@shadowkek\" in source_line\n    assert \"@burdakekw\" in source_line\n    assert \"закрытый Telegram-канал\" in source_line\n    assert \"private_2445382077\" not in source_line\n    print(\"BB V.G. wheel interaction subsystem self-test passed\")\n",
          )

          changelog = Path("docs/PROJECT_CHANGELOG_RU.md")
          text = changelog.read_text(encoding="utf-8")
          note = """## 2026-09-06 — диагностика автоучастия и несколько источников одного колеса\n\n- `betboom_participation_browser.py` теперь сохраняет отдельный безопасный XHR/fetch trace BetBoom для фактического клика участия. Заголовки, cookies, request body, query-параметры и секреты не сохраняются; диагностический JSON ограничен endpoint/status и разрешёнными полями результата/ошибки. Механика клика и retry не изменена.\n- `auto_participation_recovery.py` сохраняет все свежие публикации одного wheel key, даже если для API-проверки используется только самая новая публикация.\n- `bbvg/bot/wheels.py` показывает объединённые источники активного колеса; внутренний `private_*` идентификатор отображается как `закрытый Telegram-канал`.\n\n"""
          if note not in text:
              changelog.write_text(note + text, encoding="utf-8")
          PY

      - name: Run targeted self-tests
        shell: bash
        run: |
          python betboom_network_diagnostics.py
          python betboom_participation_browser.py
          python auto_participation_recovery.py --self-test
          python -m bbvg.bot.wheels
          python -m compileall -q betboom_network_diagnostics.py betboom_participation_browser.py auto_participation_recovery.py bbvg/bot/wheels.py

      - name: Commit applied patch and remove applicator
        shell: bash
        run: |
          rm .github/workflows/apply-participation-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add betboom_network_diagnostics.py betboom_participation_browser.py auto_participation_recovery.py bbvg/bot/wheels.py docs/PROJECT_CHANGELOG_RU.md .github/workflows/apply-participation-diagnostics.yml
          git commit -m "Add participation network diagnostics and wheel source aggregation"
          git push origin HEAD:fix/participation-network-and-wheel-sources
