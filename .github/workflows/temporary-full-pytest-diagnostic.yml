name: Temporary full pytest diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Capture first failure
        shell: bash
        run: |
          set +e
          python -m pytest -x --tb=short > pytest-first-failure.log 2>&1
          code=$?
          echo "$code" > pytest-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pytest-first-failure
          path: |
            pytest-first-failure.log
            pytest-exit-code.txt
          retention-days: 1
