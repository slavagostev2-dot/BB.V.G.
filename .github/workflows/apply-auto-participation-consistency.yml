name: Apply auto participation consistency

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && github.head_ref == 'agent/auto-participation-consistency-20260725' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BOT_TOKEN: test-bot-token
      BOT_STATE_KEY: test-state-key
      BOT_CHAT_ID: '1'
      ADMIN_USER_ID: '1'
      BBVG_TEST_MODE: '1'
      TELEGRAM_WEB_DOMAIN: telegram.me
      FINAL_REMINDER_BEFORE_MINUTES: '5'
      ACTIVE_REMOVE_GRACE_MINUTES: '0'
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/auto-participation-consistency-20260725
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Align patch with current contracts
        run: python scripts/adjust_auto_participation_consistency_patch.py

      - name: Apply complete consistency contract
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            python scripts/apply_auto_participation_consistency.py
            python scripts/extend_auto_participation_consistency.py
          } 2>&1 | tee /tmp/auto-participation-consistency.log
          code=${PIPESTATUS[0]}
          set -e
          exit "$code"

      - name: Publish patch diagnostic
        if: ${{ steps.patch.outcome == 'failure' }}
        run: |
          set -euo pipefail
          cp /tmp/auto-participation-consistency.log /tmp/diagnostic.txt
          git reset --hard HEAD
          mkdir -p engineering
          tail -n 260 /tmp/diagnostic.txt > engineering/AUTO_PARTICIPATION_CONSISTENCY_DIAGNOSTIC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engineering/AUTO_PARTICIPATION_CONSISTENCY_DIAGNOSTIC.txt
          git commit -m 'Record auto participation consistency diagnostic [skip ci]'
          git push origin HEAD:agent/auto-participation-consistency-20260725
          exit 1

      - name: Remove temporary repair files
        run: |
          git rm -f --ignore-unmatch scripts/apply_auto_participation_consistency.py scripts/adjust_auto_participation_consistency_patch.py scripts/extend_auto_participation_consistency.py scripts/.auto-participation-consistency-trigger engineering/AUTO_PARTICIPATION_CONSISTENCY_DIAGNOSTIC.txt

      - name: Validate focused contracts
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            python -m py_compile monitor.py betboom_auto_participation.py auto_participation_worker.py auto_participation_bot_sync.py auto_participation_recovery.py auto_participation_owner_sync.py auto_participation_notifications.py betboom_account_participation.py xflarxx_account_participation.py tests/test_auto_participation_consistency.py
            python auto_participation_bot_sync.py --self-test
            python auto_participation_recovery.py --self-test
            python auto_participation_notifications.py
            python betboom_account_participation.py --self-test
            python xflarxx_account_participation.py --self-test
            python betboom_participation_browser.py
            python -m pytest -q tests/test_auto_participation_consistency.py
            python -m pytest -q -k 'auto_participation or participation_browser'
          } 2>&1 | tee /tmp/auto-participation-focused.log
          code=${PIPESTATUS[0]}
          set -e
          exit "$code"

      - name: Publish focused validation diagnostic
        if: ${{ steps.focused.outcome == 'failure' }}
        run: |
          set -euo pipefail
          cp /tmp/auto-participation-focused.log /tmp/diagnostic.txt
          git reset --hard HEAD
          mkdir -p engineering
          tail -n 320 /tmp/diagnostic.txt > engineering/AUTO_PARTICIPATION_CONSISTENCY_DIAGNOSTIC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engineering/AUTO_PARTICIPATION_CONSISTENCY_DIAGNOSTIC.txt
          git commit -m 'Record auto participation focused validation diagnostic [skip ci]'
          git push origin HEAD:agent/auto-participation-consistency-20260725
          exit 1

      - name: Validate production contracts
        run: |
          python -m pytest -q tests/test_production_stability_guardrails.py tests/test_current_contracts.py tests/test_button_matrix.py

      - name: Validate full repository
        run: python -m pytest -q

      - name: Commit verified implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'No consistency changes were produced' >&2
            exit 1
          fi
          git commit -m 'Make auto participation delivery and outcomes consistent'
          git push origin HEAD:agent/auto-participation-consistency-20260725
