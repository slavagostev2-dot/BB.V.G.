name: Apply participation diagnostics code

on:
  push:
    branches:
      - fix/participation-network-and-wheel-sources
    paths:
      - .github/workflows/apply-participation-code.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/participation-network-and-wheel-sources
          fetch-depth: 1
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply code patch
        run: python .github/apply_participation_patch.py
      - name: Run targeted checks
        run: |
          python betboom_network_diagnostics.py
          python betboom_participation_browser.py
          python auto_participation_recovery.py --self-test
          python -m bbvg.bot.wheels
          python -m compileall -q betboom_network_diagnostics.py betboom_participation_browser.py auto_participation_recovery.py bbvg/bot/wheels.py
      - name: Commit code changes
        run: |
          rm .github/apply_participation_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add betboom_network_diagnostics.py betboom_participation_browser.py auto_participation_recovery.py bbvg/bot/wheels.py docs/PROJECT_CHANGELOG_RU.md .github/apply_participation_patch.py
          git commit -m "Add participation diagnostics and aggregate wheel sources"
          git push origin HEAD:fix/participation-network-and-wheel-sources
