name: Apply Control Center navigation ownership

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && github.head_ref == 'agent/control-center-navigation-consolidation-20260725' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BOT_TOKEN: test-bot-token
      BOT_STATE_KEY: test-state-key
      BOT_CHAT_ID: '1'
      ADMIN_USER_ID: '1'
      BBVG_TEST_MODE: '1'
      TELEGRAM_WEB_DOMAIN: telegram.me
      FINAL_REMINDER_BEFORE_MINUTES: '5'
      ACTIVE_REMOVE_GRACE_MINUTES: '0'
    steps:
      - name: Checkout navigation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/control-center-navigation-consolidation-20260725
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Prepare navigation patch
        run: python scripts/prepare_navigation_patch_v2.py

      - name: Apply navigation ownership patch
        id: apply_patch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/apply_navigation_ownership_consolidation.py 2>&1 | tee /tmp/navigation-ownership-apply.log
          code=${PIPESTATUS[0]}
          set -e
          exit "$code"

      - name: Publish exact patch diagnostic
        if: ${{ steps.apply_patch.outcome == 'failure' }}
        run: |
          set -euo pipefail
          cp /tmp/navigation-ownership-apply.log /tmp/navigation-ownership-diagnostic.txt
          git reset --hard HEAD
          mkdir -p engineering
          tail -n 160 /tmp/navigation-ownership-diagnostic.txt > engineering/NAVIGATION_OWNERSHIP_DIAGNOSTIC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engineering/NAVIGATION_OWNERSHIP_DIAGNOSTIC.txt
          git commit -m 'Record navigation ownership patch diagnostic [skip ci]'
          git push origin HEAD:agent/control-center-navigation-consolidation-20260725
          exit 1

      - name: Adjust preserved navigation contracts
        run: python scripts/adjust_navigation_ownership_contracts.py

      - name: Remove temporary patch files
        run: |
          git rm -f --ignore-unmatch scripts/apply_navigation_ownership_consolidation.py scripts/prepare_navigation_patch_v2.py scripts/adjust_navigation_ownership_contracts.py scripts/.navigation-ownership-trigger .github/workflows/apply-navigation-ownership.yml engineering/NAVIGATION_OWNERSHIP_DIAGNOSTIC.txt engineering/NAVIGATION_OWNERSHIP_VALIDATION.txt

      - name: Validate navigation and full repository
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            python -m py_compile admin_panel_runtime_v41.py bbvg/bot/interface.py bbvg/bot/runtime.py bbvg/bot/users.py tests/test_navigation_ownership.py
            python admin_panel_runtime_v41.py --self-test
            python scripts/telegram_start_state_smoke.py
            python -m pytest -q tests/test_navigation_ownership.py tests/test_telegram_start_state_safety.py tests/test_button_matrix.py tests/test_production_stability_guardrails.py tests/test_current_contracts.py
            python -m pytest -q
          } 2>&1 | tee /tmp/navigation-ownership-validation.log
          code=${PIPESTATUS[0]}
          set -e
          exit "$code"

      - name: Publish exact validation diagnostic
        if: ${{ steps.validation.outcome == 'failure' }}
        run: |
          set -euo pipefail
          cp /tmp/navigation-ownership-validation.log /tmp/navigation-ownership-validation-copy.log
          git reset --hard HEAD
          mkdir -p engineering
          tail -n 260 /tmp/navigation-ownership-validation-copy.log > engineering/NAVIGATION_OWNERSHIP_VALIDATION.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engineering/NAVIGATION_OWNERSHIP_VALIDATION.txt
          git commit -m 'Record navigation ownership validation diagnostic [skip ci]'
          git push origin HEAD:agent/control-center-navigation-consolidation-20260725
          exit 1

      - name: Commit clean navigation implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'Navigation implementation produced no staged changes' >&2
            exit 1
          fi
          git commit -m 'Consolidate Control Center navigation ownership'
          git push origin HEAD:agent/control-center-navigation-consolidation-20260725
