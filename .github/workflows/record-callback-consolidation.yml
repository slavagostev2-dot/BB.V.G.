name: Record callback consolidation changelog

on:
  push:
    branches:
      - agent/control-center-callback-consolidation-20260725
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  record:
    if: ${{ github.actor != 'github-actions[bot]' && github.head_ref == 'agent/control-center-callback-consolidation-20260725' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout working branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/control-center-callback-consolidation-20260725
          fetch-depth: 0

      - name: Prepend project changelog entry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/PROJECT_CHANGELOG_RU.md')
          text = path.read_text(encoding='utf-8')
          heading = '## 2026-07-25 — Callback участия сведены к одному владельцу'
          if heading not in text:
              marker = '---\n\n'
              entry = '''## 2026-07-25 — Callback участия сведены к одному владельцу

Обработка `bb:p:<token>` и `wheel:part:<key>` больше не дублируется в трёх
runtime-слоях. Единственным владельцем личного event-scoped участия закреплён
существующий `PersonalWheelVotingMixin` в `personal_wheel_voting.py`.

К тому же владельцу перенесено восстановление потерянного `button_contexts` по
однозначному активному событию. Из `admin_panel_runtime_v41.py`,
`bbvg/bot/runtime.py` и `notification_button_recovery.py` удалены отдельные
перехваты, token-helper и override. Строки callback не изменены: кнопка из
уведомления удаляет исходную карточку после отметки, а кнопка списка активных
колёс обновляет то же сообщение.

Добавлен отрицательный архитектурный контракт против возврата нескольких
владельцев. Runtime JSON, encrypted state, список источников и release marker не
изменялись.

**Backup перед изменением:**
`backup/before-control-center-callback-consolidation-20260725` →
`48f3c3e24150025fd8769f6ea92e4ffae9f8d550`.

'''
              if marker not in text:
                  raise SystemExit('Changelog separator is missing')
              text = text.replace(marker, marker + entry, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changelog and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/record-callback-consolidation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_CHANGELOG_RU.md
          git commit -m 'Record callback consolidation in project changelog'
          git push origin HEAD:agent/control-center-callback-consolidation-20260725

# One-shot workflow: removed after the changelog commit.
