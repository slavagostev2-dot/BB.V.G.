name: Record callback consolidation changelog

on:
  push:
    branches:
      - agent/control-center-callback-consolidation-20260725

permissions:
  contents: write

jobs:
  record:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout working branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/control-center-callback-consolidation-20260725
          fetch-depth: 0

      - name: Prepend project changelog entry
        env:
          ENTRY_B64: 
        run: python -c "import base64,os,pathlib; p=pathlib.Path('docs/PROJECT_CHANGELOG_RU.md'); t=p.read_text(encoding='utf-8'); h='## 2026-07-25 — Callback участия сведены к одному владельцу'; e=base64.b64decode(os.environ['ENTRY_B64']).decode(); p.write_text(t if h in t else t.replace('---\n\n','---\n\n'+e,1),encoding='utf-8')"

      - name: Commit changelog and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/record-callback-consolidation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_CHANGELOG_RU.md
          git commit -m 'Record callback consolidation in project changelog'
          git push origin HEAD:agent/control-center-callback-consolidation-20260725
