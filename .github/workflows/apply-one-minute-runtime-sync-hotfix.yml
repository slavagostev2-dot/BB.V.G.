name: Apply one-minute runtime sync hotfix

on:
  push:
    branches: [agent/fix-one-minute-runtime-sync-20260725]
    paths:
      - "scripts/apply_one_minute_runtime_sync_hotfix.py"
      - ".github/workflows/apply-one-minute-runtime-sync-hotfix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/fix-one-minute-runtime-sync-20260725
          fetch-depth: 0

      - name: Apply focused patch
        run: python scripts/apply_one_minute_runtime_sync_hotfix.py

      - name: Commit patched production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_one_minute_runtime_sync_hotfix.py
          git rm .github/workflows/apply-one-minute-runtime-sync-hotfix.yml
          git add .github/workflows/monitor.yml admin_panel_v2.py tests/test_monitor_interval_runtime_sync.py
          git commit -m "Fix one-minute monitoring and runtime state publication"
          git push origin HEAD:agent/fix-one-minute-runtime-sync-20260725

# Second push intentionally triggers this temporary branch-only workflow.
