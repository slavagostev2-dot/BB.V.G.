name: Runtime publisher diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - "runtime_state_publisher.py"
      - "tests/test_monitor_runtime_publisher.py"
      - ".github/workflows/monitor.yml"
      - ".github/workflows/runtime-publisher-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_TOKEN: test-bot-token
      BOT_STATE_KEY: test-state-key
      BOT_CHAT_ID: "1"
      ADMIN_USER_ID: "1"
      BBVG_TEST_MODE: "1"
      TELEGRAM_WEB_DOMAIN: telegram.me
      FINAL_REMINDER_BEFORE_MINUTES: "5"
      ACTIVE_REMOVE_GRACE_MINUTES: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Publisher self-test
        continue-on-error: true
        run: python runtime_state_publisher.py --self-test
      - name: Merge behavior test
        continue-on-error: true
        run: python -m pytest -q tests/test_monitor_runtime_publisher.py::test_monitor_merge_preserves_browser_success_without_resurrecting_closed_wheel
      - name: CAS retry test
        continue-on-error: true
        run: python -m pytest -q tests/test_monitor_runtime_publisher.py::test_monitor_publish_retries_cas_and_writes_latest_merge_back
      - name: Workflow contract test
        continue-on-error: true
        run: python -m pytest -q tests/test_monitor_runtime_publisher.py::test_monitor_workflow_uses_one_publisher_and_does_not_block_later_files
      - name: Full pytest first failure
        continue-on-error: true
        run: python -m pytest -q --maxfail=1 --junitxml=full-pytest.xml
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-publisher-pytest
          path: full-pytest.xml
          if-no-files-found: error
