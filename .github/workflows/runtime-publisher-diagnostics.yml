name: Runtime publisher diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - "runtime_state_publisher.py"
      - "tests/test_monitor_runtime_publisher.py"
      - ".github/workflows/monitor.yml"
      - ".github/workflows/runtime-publisher-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BOT_TOKEN: test-bot-token
      BOT_STATE_KEY: test-state-key
      BOT_CHAT_ID: "1"
      ADMIN_USER_ID: "1"
      BBVG_TEST_MODE: "1"
      TELEGRAM_WEB_DOMAIN: telegram.me
      FINAL_REMINDER_BEFORE_MINUTES: "5"
      ACTIVE_REMOVE_GRACE_MINUTES: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Repository preflight
        run: python preflight.py
      - name: Production acceptance sequence
        run: |
          python tests/production_acceptance.py --section stability
          python tests/production_acceptance.py --section unified
          python tests/production_acceptance.py --section ci
          python tests/production_acceptance.py --section interface
          python tests/production_acceptance.py --section lifecycle
          python admin_runtime.py --self-test
          python system_checks_v3.py --self-test
      - name: Coverage after production acceptance
        continue-on-error: true
        run: |
          python -m pytest \
            --cov=notification_router \
            --cov=notification_integrity_v2 \
            --cov=wheel_publications_v2 \
            --cov=rating_policy \
            --cov-report=term-missing \
            --cov-report=xml:critical-coverage.xml \
            --cov-fail-under=80 \
            --junitxml=coverage-pytest.xml
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-publisher-pytest
          path: |
            coverage-pytest.xml
            critical-coverage.xml
          if-no-files-found: error
