name: Apply Telegram start resilience fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && github.head_ref == 'agent/start-resilience-20260725' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BOT_TOKEN: test-bot-token
      BOT_STATE_KEY: test-state-key
      BOT_CHAT_ID: '1'
      ADMIN_USER_ID: '1'
      BBVG_TEST_MODE: '1'
      TELEGRAM_WEB_DOMAIN: telegram.me
      FINAL_REMINDER_BEFORE_MINUTES: '5'
      ACTIVE_REMOVE_GRACE_MINUTES: '0'
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/start-resilience-20260725
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply fix
        run: python scripts/apply_start_resilience_fix.py

      - name: Remove temporary patch files
        run: |
          git rm scripts/apply_start_resilience_fix.py
          git rm .github/workflows/apply-start-resilience-fix.yml
          git rm -f --ignore-unmatch engineering/START_RESILIENCE_DIAGNOSTIC.txt

      - name: Compile changed runtime
        run: python -m py_compile admin_panel_v2.py scripts/telegram_start_state_smoke.py tests/test_telegram_start_state_safety.py

      - name: Validate Telegram start safety
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            python -m scripts.telegram_start_state_smoke
            python -m pytest -q tests/test_telegram_start_state_safety.py tests/test_current_contracts.py tests/test_production_stability_guardrails.py
          } 2>&1 | tee /tmp/start-resilience-focused.log
          code=${PIPESTATUS[0]}
          set -e
          exit "$code"

      - name: Publish focused diagnostic
        if: ${{ steps.focused.outcome == 'failure' }}
        run: |
          set -euo pipefail
          cp /tmp/start-resilience-focused.log /tmp/start-resilience-focused-copy.log
          git reset --hard HEAD
          mkdir -p engineering
          tail -n 400 /tmp/start-resilience-focused-copy.log > engineering/START_RESILIENCE_DIAGNOSTIC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engineering/START_RESILIENCE_DIAGNOSTIC.txt
          git commit -m 'Record Telegram start resilience diagnostic [skip ci]'
          git push origin HEAD:agent/start-resilience-20260725
          exit 1

      - name: Validate Control Center candidate
        run: bash scripts/validate_control_center.sh

      - name: Run full repository tests
        run: python -m pytest -q

      - name: Commit verified fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Keep Telegram start independent from profile persistence'
          git push origin HEAD:agent/start-resilience-20260725
