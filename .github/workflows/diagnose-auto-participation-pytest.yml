name: Diagnose auto participation pytest

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' && github.head_ref == 'agent/auto-participation-contract-20260725' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOT_TOKEN: test-bot-token
      BOT_STATE_KEY: test-state-key
      BOT_CHAT_ID: '1'
      ADMIN_USER_ID: '1'
      BBVG_TEST_MODE: '1'
      TELEGRAM_WEB_DOMAIN: telegram.me
      FINAL_REMINDER_BEFORE_MINUTES: '5'
      ACTIVE_REMOVE_GRACE_MINUTES: '0'
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/auto-participation-contract-20260725
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Capture exact pytest failure
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest \
            --cov=notification_router \
            --cov=notification_integrity_v2 \
            --cov=wheel_publications_v2 \
            --cov=rating_policy \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 2>&1 | tee /tmp/pytest-diagnostic.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish exact diagnostic
        run: |
          set -euo pipefail
          cp /tmp/pytest-diagnostic.log /tmp/pytest-diagnostic-copy.log
          git reset --hard HEAD
          mkdir -p engineering
          {
            echo "pytest_exit_code=${{ steps.pytest.outputs.exit_code }}"
            tail -n 500 /tmp/pytest-diagnostic-copy.log
          } > engineering/AUTO_PARTICIPATION_PYTEST_DIAGNOSTIC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engineering/AUTO_PARTICIPATION_PYTEST_DIAGNOSTIC.txt
          git commit -m 'Record auto participation pytest diagnostic [skip ci]'
          git push origin HEAD:agent/auto-participation-contract-20260725
