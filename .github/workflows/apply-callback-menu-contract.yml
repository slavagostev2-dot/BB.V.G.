name: Apply callback same-message menu contract

on:
  push:
    branches:
      - agent/control-center-callback-consolidation-20260725

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOT_TOKEN: test-bot-token
      BOT_STATE_KEY: test-state-key
      BOT_CHAT_ID: '1'
      ADMIN_USER_ID: '1'
      BBVG_TEST_MODE: '1'
      TELEGRAM_WEB_DOMAIN: telegram.me
      FINAL_REMINDER_BEFORE_MINUTES: '5'
      ACTIVE_REMOVE_GRACE_MINUTES: '0'
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/control-center-callback-consolidation-20260725
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Apply authoritative button-matrix contract
        run: |
          python scripts/apply_callback_menu_contract.py
          git rm scripts/apply_callback_menu_contract.py .github/workflows/apply-callback-menu-contract.yml
          git rm -f engineering/CALLBACK_PYTEST_DIAGNOSTIC.txt || true

      - name: Validate exact clean callback diff
        run: |
          python -m py_compile personal_wheel_voting.py bbvg/bot/runtime.py admin_panel_runtime_v41.py notification_button_recovery.py
          python personal_wheel_voting.py
          python -m bbvg.bot.runtime --self-test
          python admin_panel_runtime_v41.py --self-test
          python notification_button_recovery.py --self-test
          python -m pytest -q tests/test_button_matrix.py tests/test_production_stability_guardrails.py tests/test_current_contracts.py
          python -m pytest -q

      - name: Commit clean implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add personal_wheel_voting.py bbvg/bot/runtime.py admin_panel_runtime_v41.py tests/test_production_stability_guardrails.py engineering/REFACTOR_PLAN_RU.md docs/PROJECT_CHANGELOG_RU.md
          git commit -m 'Preserve same-message menu after personal participation'
          git push origin HEAD:agent/control-center-callback-consolidation-20260725
