name: Export periodic outage workflow payloads

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  export:
    if: ${{ github.actor != 'github-actions[bot]' && github.head_ref == 'agent/periodic-outage-root-fix-20260725' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout root-fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/periodic-outage-root-fix-20260725
          fetch-depth: 0

      - name: Export verified workflow payloads
        run: python scripts/export_periodic_outage_workflows.py

      - name: Commit payload blobs
        run: |
          set -euo pipefail
          git rm scripts/export_periodic_outage_workflows.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engineering/workflow_payloads/admin-bot.yml engineering/workflow_payloads/system-health.yml
          git commit -m 'Export verified periodic outage workflow payloads'
          git push origin HEAD:agent/periodic-outage-root-fix-20260725
