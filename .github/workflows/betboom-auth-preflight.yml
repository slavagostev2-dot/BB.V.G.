name: BB V.G. BetBoom auth preflight
run-name: BetBoom auth preflight — ${{ github.event_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BETBOOM_STORAGE_STATE_JSON_PART1: ${{ secrets.BETBOOM_STORAGE_STATE_JSON_PART1 }}
      BETBOOM_STORAGE_STATE_JSON_PART2: ${{ secrets.BETBOOM_STORAGE_STATE_JSON_PART2 }}
      BETBOOM_STORAGE_STATE_JSON_PART3: ${{ secrets.BETBOOM_STORAGE_STATE_JSON_PART3 }}
      BETBOOM_STORAGE_STATE_JSON_PART4: ${{ secrets.BETBOOM_STORAGE_STATE_JSON_PART4 }}
      BETBOOM_STORAGE_STATE_JSON_PART5: ${{ secrets.BETBOOM_STORAGE_STATE_JSON_PART5 }}
      BETBOOM_STORAGE_STATE_JSON_PART6: ${{ secrets.BETBOOM_STORAGE_STATE_JSON_PART6 }}
      BETBOOM_BROWSER_CHANNEL: chrome
      BETBOOM_IDENTITY_TIMEOUT_MS: "20000"
      BETBOOM_SESSION_HEALTH_TIMEOUT_MS: "20000"

    steps:
      - name: Checkout latest main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify three distinct BetBoom profiles and active sessions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          import betboom_profile_identity as identity
          import betboom_session_health as session_health

          report = identity.build_identity_report()
          accounts = report.get("accounts")
          if not isinstance(accounts, dict):
              raise SystemExit("BetBoom identity report is unavailable")

          expected = (
              "vyacheslav_primary",
              "vyacheslav_secondary",
              "xflarxx_primary",
          )
          safe_accounts = {}
          for account_key in expected:
              row = accounts.get(account_key)
              if not isinstance(row, dict):
                  raise SystemExit(f"Missing BetBoom identity row: {account_key}")
              status = str(row.get("status") or "")
              revision = str(row.get("auth_revision") or "")
              if status != "ok":
                  raise SystemExit(
                      f"BetBoom identity check failed for {account_key}: {status}"
                  )
              if not revision.startswith("auth:v1:"):
                  raise SystemExit(
                      f"BetBoom auth revision is unavailable for {account_key}"
                  )
              safe_accounts[account_key] = {
                  "identity_status": status,
                  "auth_revision": revision,
              }

          collision_groups = report.get("collision_groups")
          if collision_groups:
              raise SystemExit(
                  "BetBoom profile collision detected: "
                  + json.dumps(collision_groups, ensure_ascii=False)
              )
          revisions = [safe_accounts[key]["auth_revision"] for key in expected]
          if len(set(revisions)) != len(revisions):
              raise SystemExit("BetBoom auth revisions are not distinct")

          health = session_health.run()
          rows = health.get("accounts")
          if not isinstance(rows, list):
              raise SystemExit("BetBoom session health report is unavailable")
          by_key = {
              str(row.get("account_key") or ""): row
              for row in rows
              if isinstance(row, dict)
          }
          for account_key in expected:
              row = by_key.get(account_key)
              if not isinstance(row, dict):
                  raise SystemExit(f"Missing session-health row: {account_key}")
              status = str(row.get("status") or "")
              if row.get("session_active") is not True:
                  raise SystemExit(
                      f"BetBoom session is not active for {account_key}: {status}"
                  )
              safe_accounts[account_key]["session_status"] = status

          output = {
              "status": "ok",
              "profiles_distinct": True,
              "active_sessions": len(expected),
              "accounts": safe_accounts,
          }
          Path("betboom_auth_preflight.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("BetBoom auth preflight OK: 3 distinct profiles, 3 active sessions")
          for account_key in expected:
              row = safe_accounts[account_key]
              print(
                  f"{account_key}: identity={row['identity_status']} "
                  f"session={row['session_status']} auth_revision={row['auth_revision']}"
              )
          PY

      - name: Upload safe preflight report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: betboom-auth-preflight-${{ github.run_id }}
          path: betboom_auth_preflight.json
          if-no-files-found: ignore
          retention-days: 7
